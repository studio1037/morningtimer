name: Morning Face regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morning-face-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Chromium regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run all regression and contract tests
        run: npm test
      - name: Prepare isolated Cloudflare Pages preview package
        run: node scripts/build-preview.mjs
      - name: Upload static preview artifact (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: morning-face-v29-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-face-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
